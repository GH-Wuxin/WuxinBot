name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run offline checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Publish failing check tail
        if: failure()
        run: |
          if [ -f check.log ]; then
            {
              echo '## Failing check tail'
              echo '```text'
              tail -n 160 check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
