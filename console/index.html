<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WuxinBot · 控制台原型</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-puck" aria-hidden="true">w!</span>
    <span class="brand-name">WuxinBot</span>
    <span class="brand-tag">control</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="主导航">
    <button class="tab is-active" data-page="overview">总览</button>
    <button class="tab" data-page="groups">群聊</button>
    <button class="tab" data-page="osu">osu!</button>
    <button class="tab" data-page="logs">日志</button>
    <button class="tab" data-page="runtime">运行控制</button>
    <button class="tab" id="moreBtn" data-page="__more">更多 <span class="caret">▾</span></button>
  </nav>
  <div class="topbar-right">
    <span class="status-dot" title="OneBot 在线"></span>
    <span class="status-text">已连接 · deepseek-flash</span>
    <span class="chip chip--amber" id="liveBadge" title="">演示数据</span>
    <button class="btn btn-ghost" id="pauseBtn">暂停</button>
    <span class="avatar" aria-hidden="true">P</span>
  </div>
  <div class="more-menu" id="moreMenu" hidden>
    <div>
      <h4>运行与群聊</h4>
      <button data-page="randomImages">随机发图</button>
      <button data-page="agent">Agent</button>
    </div>
    <div>
      <h4>群友与记忆</h4>
      <button data-page="members">成员</button>
      <button data-page="persona">人设</button>
      <button data-page="memory">记忆</button>
      <button data-page="relationships">关系</button>
      <button data-page="profileLogs">画像日志</button>
    </div>
    <div>
      <h4>系统设置</h4>
      <button data-page="model">模型</button>
      <button data-page="integrations">集成</button>
      <button data-page="permissions">权限</button>
      <button data-page="maintenance">维护</button>
    </div>
  </div>
</header>

<main id="view" class="view"></main>
<script src="./bridge.js"></script>
<script src="./app.js"></script>
<script src="./live.js"></script>
<script src="./boot-core.js"></script>
<script src="./boot-pages.js"></script>
<script src="./boot-actions.js"></script>
</body>
</html>
